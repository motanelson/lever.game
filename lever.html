<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Give Me A Pivot! - Physics Lever Game</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: #1a1e29;
    color: #e0e6ed;
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    min-height: 100vh;
    padding: 15px;
  }
  h1 { font-size: 26px; margin-bottom: 5px; color: #f1c40f; }
  p.subtitle { font-size: 14px; color: #95a5a6; margin-bottom: 12px; }
  
  #game-container {
    position: relative;
    box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    border-radius: 12px;
    overflow: hidden;
    border: 2px solid #34495e;
  }
  canvas { display: block; background: #2c3e50; }
  
  #ui-panel {
    width: 800px;
    background: #243342;
    padding: 12px 20px;
    border-radius: 0 0 12px 12px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-top: 1px solid #3d566e;
  }
  .control-group {
    display: flex;
    flex-direction: column;
    gap: 4px;
  }
  label { font-size: 13px; font-weight: bold; color: #bdc3c7; }
  input[type="range"] {
    width: 260px;
    accent-color: #f1c40f;
    cursor: pointer;
  }
  button {
    background: #27ae60;
    color: white;
    border: none;
    padding: 10px 20px;
    font-size: 15px;
    font-weight: bold;
    border-radius: 6px;
    cursor: pointer;
    transition: 0.15s ease;
  }
  button:hover { background: #2ecc71; transform: translateY(-1px); }
  button:active { transform: translateY(1px); }
  button#resetBtn { background: #e67e22; }
  button#resetBtn:hover { background: #f39c12; }

  #stats {
    margin-top: 10px;
    width: 800px;
    display: flex;
    justify-content: space-between;
    font-size: 13px;
    background: #16202c;
    padding: 8px 16px;
    border-radius: 6px;
  }
  .stat-box { display: flex; gap: 6px; }
  .stat-label { color: #7f8c8d; }
  .stat-val { font-weight: bold; color: #ecf0f1; }
</style>
</head>
<body>

  <h1>⚖️ GIVE ME A PIVOT</h1>
  <p class="subtitle">Use your fixed <b>20 kg</b> weight to lift heavier loads past the target line!</p>

  <div id="game-container">
    <canvas id="gameCanvas" width="800" height="420"></canvas>
    <div id="ui-panel">
      <div class="control-group">
        <label for="fulcrumSlider">FULCRUM POSITION (Shift Leverage):</label>
        <input type="range" id="fulcrumSlider" min="0.15" max="0.85" step="0.005" value="0.5">
      </div>
      <div style="display: flex; gap: 10px;">
        <button id="applyBtn">Drop 20kg Weight</button>
        <button id="resetBtn">Reset</button>
      </div>
    </div>
  </div>

  <div id="stats">
    <div class="stat-box"><span class="stat-label">Level:</span><span id="lvlVal" class="stat-val">1/4</span></div>
    <div class="stat-box"><span class="stat-label">Load Weight:</span><span id="loadVal" class="stat-val">40 kg</span></div>
    <div class="stat-box"><span class="stat-label">Player Torque:</span><span id="pTorqueVal" class="stat-val">0 N·m</span></div>
    <div class="stat-box"><span class="stat-label">Load Torque:</span><span id="lTorqueVal" class="stat-val">0 N·m</span></div>
  </div>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

// Game Levels
const levels = [
  { name: "Iron Crate", loadMass: 40, targetHeight: 55, leverLen: 560, desc: "A modest 40kg crate. Shift the pivot to lift it!" },
  { name: "Ancient Boulder", loadMass: 75, targetHeight: 45, leverLen: 580, desc: "75kg boulder! You'll need more leverage." },
  { name: "Reinforced Safe", loadMass: 120, targetHeight: 35, leverLen: 600, desc: "120kg safe. Small load-arm needed!" },
  { name: "The Gold Vault", loadMass: 200, targetHeight: 25, leverLen: 620, desc: "200kg! Extreme leverage required." }
];

let currentLevel = 0;
const PLAYER_MASS = 20; // Exactly 20 kg
const GRAVITY = 9.81;

// Beam state
let leverRatio = 0.5; // Fulcrum ratio [0..1]
let beamAngle = 0;    // Radians
let beamAngVel = 0;
let isApplied = false;
let weightDropY = 0;
let weightActive = false;
let levelComplete = false;

// Audio context for sound FX
const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
function playTone(freq, type="sine", duration=0.15) {
  try {
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = type;
    osc.frequency.value = freq;
    gain.gain.setValueAtTime(0.12, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start();
    osc.stop(audioCtx.currentTime + duration);
  } catch(e) {}
}

const fulcrumSlider = document.getElementById('fulcrumSlider');
const applyBtn = document.getElementById('applyBtn');
const resetBtn = document.getElementById('resetBtn');

fulcrumSlider.addEventListener('input', (e) => {
  if (!weightActive) {
    leverRatio = parseFloat(e.target.value);
  }
});

applyBtn.addEventListener('click', () => {
  if (levelComplete) {
    nextLevel();
    return;
  }
  if (!weightActive) {
    weightActive = true;
    weightDropY = 60; // Start drop animation
    playTone(300, "square", 0.1);
  }
});

resetBtn.addEventListener('click', resetLevel);

function resetLevel() {
  beamAngle = 0;
  beamAngVel = 0;
  weightActive = false;
  isApplied = false;
  levelComplete = false;
  applyBtn.textContent = "Drop 20kg Weight";
  applyBtn.style.background = "#27ae60";
}

function nextLevel() {
  currentLevel = (currentLevel + 1) % levels.length;
  resetLevel();
  fulcrumSlider.value = 0.5;
  leverRatio = 0.5;
}

function updatePhysics() {
  const lvl = levels[currentLevel];
  const totalLength = lvl.leverLen;
  const leftArm = totalLength * leverRatio;
  const rightArm = totalLength * (1 - leverRatio);

  // Live torque values
  const playerTorque = isApplied ? (PLAYER_MASS * GRAVITY * (leftArm / 100)) : 0;
  const loadTorque = (lvl.loadMass * GRAVITY * (rightArm / 100));

  document.getElementById('lvlVal').textContent = `${currentLevel + 1}/${levels.length} (${lvl.name})`;
  document.getElementById('loadVal').textContent = `${lvl.loadMass} kg`;
  document.getElementById('pTorqueVal').textContent = `${Math.round(playerTorque)} N·m`;
  document.getElementById('lTorqueVal').textContent = `${Math.round(loadTorque)} N·m`;

  // Animate dropping the 20kg weight
  if (weightActive && !isApplied) {
    weightDropY += 12;
    // Check if hit the beam
    const fulcrumX = canvas.width / 2;
    const beamY = 270;
    const leftTipX = fulcrumX - leftArm;
    const leftTipY = beamY + Math.sin(beamAngle) * leftArm;
    if (weightDropY >= leftTipY - 18) {
      isApplied = true;
      playTone(150, "triangle", 0.25);
    }
  }

  // Angular torque physics
  if (isApplied) {
    // Net torque (counter-clockwise is positive: player pushes down on left)
    const netTorque = (PLAYER_MASS * leftArm) - (lvl.loadMass * rightArm);
    const momentOfInertia = (PLAYER_MASS * leftArm * leftArm) + (lvl.loadMass * rightArm * rightArm) + 5000;
    const angularAcc = (netTorque / momentOfInertia) * 0.45;

    beamAngVel += angularAcc;
    beamAngVel *= 0.88; // Damping
    beamAngle += beamAngVel;

    // Beam motion limit (ground constraints)
    const maxAngle = 0.32; // ~18 degrees
    if (beamAngle > maxAngle) {
      beamAngle = maxAngle;
      beamAngVel = 0;
    } else if (beamAngle < -maxAngle) {
      beamAngle = -maxAngle;
      beamAngVel = 0;
    }

    // Check Win Condition: right load lifted high enough
    const rightTipLift = Math.sin(beamAngle) * rightArm; 
    if (rightTipLift >= lvl.targetHeight && !levelComplete) {
      levelComplete = true;
      playTone(587, "sine", 0.2);
      setTimeout(() => playTone(880, "sine", 0.4), 200);
      applyBtn.textContent = "Next Level ➔";
      applyBtn.style.background = "#f1c40f";
    }
  }
}

function draw() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  const lvl = levels[currentLevel];

  // Ground
  ctx.fillStyle = "#1e2936";
  ctx.fillRect(0, 310, canvas.width, canvas.height - 310);
  ctx.fillStyle = "#27ae60";
  ctx.fillRect(0, 310, canvas.width, 6);

  const pivotBaseX = canvas.width / 2;
  const pivotBaseY = 310;
  const fulcrumHeight = 55;
  const pivotX = pivotBaseX;
  const pivotY = pivotBaseY - fulcrumHeight;

  const totalLength = lvl.leverLen;
  const leftArm = totalLength * leverRatio;
  const rightArm = totalLength * (1 - leverRatio);

  // Fulcrum Triangle
  ctx.beginPath();
  ctx.moveTo(pivotX, pivotY);
  ctx.lineTo(pivotX - 28, pivotBaseY);
  ctx.lineTo(pivotX + 28, pivotBaseY);
  ctx.closePath();
  ctx.fillStyle = "#e67e22";
  ctx.fill();
  ctx.lineWidth = 3;
  ctx.strokeStyle = "#d35400";
  ctx.stroke();

  // Pivot axle pin
  ctx.beginPath();
  ctx.arc(pivotX, pivotY, 5, 0, Math.PI * 2);
  ctx.fillStyle = "#ffffff";
  ctx.fill();

  // Draw Lever Beam
  ctx.save();
  ctx.translate(pivotX, pivotY);
  ctx.rotate(-beamAngle); // Negative so positive torque tilts left down, right up

  // Main beam body
  ctx.fillStyle = "#95a5a6";
  ctx.fillRect(-leftArm, -8, totalLength, 16);
  ctx.strokeStyle = "#7f8c8d";
  ctx.strokeRect(-leftArm, -8, totalLength, 16);

  // Measurement hash-marks along the beam
  ctx.strokeStyle = "#34495e";
  ctx.lineWidth = 1;
  for(let x = -leftArm + 20; x < rightArm; x += 25) {
    ctx.beginPath();
    ctx.moveTo(x, -6);
    ctx.lineTo(x, 6);
    ctx.stroke();
  }

  // Right Side: Heavy Load Object
  const loadBoxSize = 36 + Math.min(lvl.loadMass * 0.15, 30);
  ctx.fillStyle = "#e74c3c";
  ctx.fillRect(rightArm - loadBoxSize, -8 - loadBoxSize, loadBoxSize, loadBoxSize);
  ctx.strokeStyle = "#c0392b";
  ctx.lineWidth = 3;
  ctx.strokeRect(rightArm - loadBoxSize, -8 - loadBoxSize, loadBoxSize, loadBoxSize);

  // Load Text
  ctx.fillStyle = "#ffffff";
  ctx.font = "bold 13px sans-serif";
  ctx.textAlign = "center";
  ctx.fillText(`${lvl.loadMass}kg`, rightArm - (loadBoxSize/2), -15 - (loadBoxSize/3));

  // Left Side: 20kg Weight (if already dropped and resting)
  if (isApplied) {
    ctx.fillStyle = "#3498db";
    ctx.fillRect(-leftArm, -42, 34, 34);
    ctx.strokeStyle = "#2980b9";
    ctx.lineWidth = 2;
    ctx.strokeRect(-leftArm, -42, 34, 34);

    ctx.fillStyle = "#fff";
    ctx.font = "bold 12px sans-serif";
    ctx.fillText("20kg", -leftArm + 17, -20);
  }

  ctx.restore();

  // Dropping 20kg weight animation
  if (weightActive && !isApplied) {
    const leftTipRestX = pivotX - leftArm;
    ctx.fillStyle = "#3498db";
    ctx.fillRect(leftTipRestX, weightDropY - 34, 34, 34);
    ctx.strokeStyle = "#2980b9";
    ctx.strokeRect(leftTipRestX, weightDropY - 34, 34, 34);
    ctx.fillStyle = "#fff";
    ctx.font = "bold 12px sans-serif";
    ctx.textAlign = "center";
    ctx.fillText("20kg", leftTipRestX + 17, weightDropY - 12);
  }

  // Draw Target Height Marker on right side
  const rightTipX = pivotX + rightArm;
  const initialLoadY = pivotY; 
  const targetY = initialLoadY - lvl.targetHeight;

  ctx.save();
  ctx.setLineDash([6, 6]);
  ctx.strokeStyle = "#f1c40f";
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(rightTipX - 60, targetY);
  ctx.lineTo(rightTipX + 40, targetY);
  ctx.stroke();

  ctx.fillStyle = "#f1c40f";
  ctx.font = "bold 12px sans-serif";
  ctx.fillText(`TARGET HEIGHT (+${lvl.targetHeight}px)`, rightTipX - 10, targetY - 8);
  ctx.restore();

  // UI status overlays
  if (levelComplete) {
    ctx.fillStyle = "rgba(46, 204, 113, 0.9)";
    ctx.fillRect(pivotBaseX - 180, 50, 360, 60);
    ctx.fillStyle = "#fff";
    ctx.font = "bold 20px sans-serif";
    ctx.textAlign = "center";
    ctx.fillText("🎉 TARGET LIFT REACHED!", pivotBaseX, 85);
  } else if (isApplied && beamAngle <= 0) {
    // Insufficient torque warning
    ctx.fillStyle = "rgba(231, 76, 60, 0.9)";
    ctx.fillRect(pivotBaseX - 170, 50, 340, 50);
    ctx.fillStyle = "#fff";
    ctx.font = "bold 15px sans-serif";
    ctx.textAlign = "center";
    ctx.fillText("⚠️ Not enough torque! Move pivot right.", pivotBaseX, 80);
  }
}

function gameLoop() {
  updatePhysics();
  draw();
  requestAnimationFrame(gameLoop);
}

gameLoop();
</script>
</body>
</html>
